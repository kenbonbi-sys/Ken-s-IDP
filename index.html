<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ken: Lộ trình 6 tháng hướng tới Product Engineer</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Momo+Signature&family=Momo+Trust+Display&family=Momo+Trust+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ================= Tokens ================= */
:root{
  color-scheme: light;
  --pink:#F95396;          /* hồng chủ đạo (trang trí, chữ lớn) */
  --pink-h:#E2338A;        /* hồng cho chữ tiêu đề trên nền sáng */
  --pink-btn:#D42A87;      /* hồng cho nền nút có chữ trắng */
  --pink-text:#C91F72;     /* hồng cho chữ nhỏ */
  --pink-200:#FEC8DC; --pink-100:#FFE3EE; --pink-50:#FFF3F8;
  /* Nền sọc kiểu nhãn M16 ("Vinh danh MoMoer 5-10-15"): sọc chéo hồng – hồng đậm, đơn vị em nên tự co theo cỡ chữ */
  --ms-bg:repeating-linear-gradient(135deg,#F95396 0 .17em,#D42A87 .17em .3em);
  --ink:#1C171A; --ink-2:#4A4046; --ink-3:#796B73;
  --ok:#12B76A; --ok-soft:#DCFCE7;
  --sh-s:0 4px 10px -4px rgba(249,83,150,.45);
  --sh-m:0 18px 40px -18px rgba(190,30,100,.38);
  --sh-l:0 40px 90px -30px rgba(120,20,70,.5);
  --out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;overflow-x:clip}
body{margin:0;background:#fff;color:var(--ink);font-family:"Momo Trust Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.lock{overflow:hidden}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--pink-btn);outline-offset:3px}
code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.88em;padding:1px 6px;border-radius:6px;background:var(--pink-100);color:var(--pink-text)}
.dsp{font-family:"Momo Trust Display","Momo Trust Sans",system-ui,sans-serif;font-weight:400;letter-spacing:-.01em}
.sig{font-family:"Momo Signature","Momo Trust Display",cursive;font-weight:400;letter-spacing:0}
.pkh{color:var(--pink-h)}
.lbl{font-size:12px;font-weight:800;line-height:1.3;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.lbl-p{color:var(--pink-text)}
.wrap{position:relative;max-width:1200px;margin:0 auto}
.ic{width:20px;height:20px;flex:0 0 auto}

/* ================= Nút ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:10px;font-size:15px;font-weight:700;line-height:1.2;text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .3s var(--out),background-color .25s ease,color .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-w{background:#fff;color:var(--ink);box-shadow:var(--sh-s)}
.btn-w:hover{color:var(--pink-text)}
.btn-p{background:var(--pink-btn);color:#fff;box-shadow:0 10px 22px -10px rgba(212,42,135,.8)}
.btn-p:hover{background:#BF1F78}
.btn-sm{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:9px}
.link{display:inline-flex;align-items:center;gap:6px;padding:6px 2px;border:0;background:none;font-size:16px;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:2px;text-underline-offset:5px;cursor:pointer}
.link:hover{color:var(--pink-text)}
.nb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-size:15px;font-weight:700;white-space:nowrap;box-shadow:var(--sh-s);cursor:pointer;transition:transform .3s var(--out),color .2s ease}
.nb:hover:not(:disabled){transform:translateY(-2px);color:var(--pink-text)}
.nb:disabled{opacity:.4;cursor:default;box-shadow:none}
.nb .ic{width:16px;height:16px}
.nb-sm{min-height:34px;padding:0 12px;font-size:13px}

/* ================= Ô ảnh ================= */
.slot{position:relative;display:block;overflow:hidden;background:var(--pink-100);color:var(--pink-text)}
.slot>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease,transform .7s var(--out)}
.slot.filled>img{opacity:1}
.slot-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;transition:opacity .4s ease}
.slot.filled .slot-ph,.slot.filled .slot-tag{opacity:0;visibility:hidden}
.slot-tag{position:absolute;left:8px;top:8px;z-index:2;display:none;align-items:center;gap:5px;max-width:calc(100% - 16px);padding:3px 9px 3px 7px;border:1.5px dashed currentColor;border-radius:999px;background:rgba(255,255,255,.92);font-size:11px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-tag .ic{width:12px;height:12px}
.slot.empty .slot-tag{display:inline-flex}
.no-helper .slot-tag{display:none!important}
.slot.flash{animation:flash 1.1s ease 3}
.ph-p{background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.95),transparent 55%),repeating-linear-gradient(135deg,#FFF3F8 0 12px,#FFE3EE 12px 13px)}
.ph-i{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#fff;color:var(--pink);box-shadow:var(--sh-s);transform:rotate(-6deg)}
.ph-i .ic{width:26px;height:26px}
.ph-p b{margin-top:6px;font-size:15px;color:var(--ink)}
.ph-p small{font-size:13px;line-height:1.4;color:var(--ink-3)}

/* ================= Thanh tiến độ cuộn ================= */
.sbar{position:fixed;left:0;right:0;top:0;z-index:70;height:4px;pointer-events:none}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#FF9CC6,var(--pink));transform:scaleX(0);transform-origin:0 50%}

/* ================= Nav (kiểu M16) ================= */
/* Theo nav M16 (dính mép trên, bo 2 góc dưới), mọi kích thước thu còn 80% */
.nav{position:sticky;top:0;z-index:40;padding:0 16px;pointer-events:none}
.nav-in{position:relative;display:flex;align-items:center;gap:16px;min-height:64px;margin:0 auto;padding:0 18px 0 30px;border-radius:0 0 19px 19px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 24px -14px rgba(60,20,45,.28);pointer-events:auto;animation:navin .9s var(--out) both}
.nav-brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;white-space:nowrap}
.nb-name{font-size:18px;line-height:1;color:var(--pink-btn)}
.nb-div{width:1px;height:26px;background:var(--ink)}
.nb-t{font-size:13px;font-weight:800;line-height:1.2;color:var(--ink)}
.nav-links{display:flex;align-items:center;gap:12px;margin-left:auto}
.nav-links a{position:relative;padding:8px 8px;border-radius:8px;font-size:15px;font-weight:400;color:var(--ink);text-decoration:none;white-space:nowrap;transition:color .2s ease}
.nav-links a::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:1px;background:var(--pink);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s var(--out)}
.nav-links a:hover,.nav-links a[aria-current=true]{color:var(--pink-text)}
.nav-links a:hover::after,.nav-links a[aria-current=true]::after{transform:scaleX(1)}
.nav-mb{display:none;place-items:center;width:40px;height:40px;flex:0 0 auto;padding:0;border:0;border-radius:10px;background:var(--pink-50);color:var(--ink);cursor:pointer}
.nav-mb .ic{width:22px;height:22px}

.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.55) 55%,rgba(255,255,255,0));pointer-events:none;animation:cloud 38s ease-in-out infinite alternate}
.cl-a{width:760px;height:280px;left:-180px;top:110px}
.cl-b{width:620px;height:240px;right:-160px;top:-40px;animation-duration:46s;animation-direction:alternate-reverse}
/* ================= Section chung ================= */
.sec{position:relative;padding:110px 24px;scroll-margin-top:30px;overflow-x:clip}
.sh{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:48px;text-align:center}
.sh h1,.sh h2{font-size:clamp(32px,4vw,54px);line-height:1.1;color:var(--ink)}
/* Tiêu đề dài giữ 1 dòng: chữ rộng ≈ 24.2em, cỡ chữ co theo bề rộng màn (trừ lề + thanh cuộn) */
.sh h2.h2-one{white-space:nowrap;font-size:min(48px,calc((100vw - 72px) / 24.6))}
.sh p{max-width:680px;font-size:18px;line-height:1.55;color:var(--ink-2)}

/* ================= Product Engineer: 4 phần học ================= */
.sec-pink{background:linear-gradient(180deg,#FDE4EE 0%,#fff 560px)}
.sec-pink .wrap{max-width:1440px}
.pl-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;align-items:stretch}
.pl{display:flex;flex-direction:column;gap:18px;min-width:0;padding:26px 24px 24px;border-radius:26px;background:#fff;box-shadow:var(--sh-m);scroll-margin-top:30px}
.pl.flash{animation:flash 1.1s ease 2}
.pl-h{display:flex;align-items:center;gap:14px}
.pl-h .mnum{width:52px}
.pl-n{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.pl-n h3{font-size:clamp(30px,2.8vw,40px);line-height:1;color:var(--pink-text)}
#pl-psych h3{font-size:clamp(26px,2.15vw,32px);line-height:1.1}
.pl-n .ms{font-size:18px}
.pl-b{display:flex;flex-direction:column;gap:10px}
.cert{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:16px;background:#FAF6F8}
.cert-i{display:grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--pink);color:#fff}
.cert-t{display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.35}
.cert-t a{font-size:16px;font-weight:700;color:var(--ink);text-decoration-color:var(--pink);text-underline-offset:3px}
.cert-t a:hover{color:var(--pink-text)}
.cert-t small{font-size:13px;color:var(--ink-3)}
.pl-plan{font-size:15px;line-height:1.5;color:var(--ink-2)}
.pl-course-list{list-style:disc;padding-left:1.45em}
.pl-course-list li+li{margin-top:4px}
.pl-list{list-style:decimal;padding-left:1.45em;font-size:15px;line-height:1.45;color:var(--ink-2)}
.pl-list li+li{margin-top:8px}
.pl-list li::marker{font-weight:700;color:var(--pink-text)}
.learn-topics,.learn-result{display:block}
.learn-topics{margin-bottom:4px}

/* ================= Hành: 5 dự án ================= */
.bn-w{position:relative;z-index:2;margin-bottom:64px}
.banner{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding:56px;overflow:hidden;color:#fff;background:radial-gradient(70% 90% at 15% 10%,#FF6FAA 0%,transparent 60%),linear-gradient(160deg,#E2338A 0%,#C21C70 100%);clip-path:polygon(0 18px,18px 18px,18px 0,calc(100% - 18px) 0,calc(100% - 18px) 18px,100% 18px,100% calc(100% - 18px),calc(100% - 18px) calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,18px calc(100% - 18px),0 calc(100% - 18px))}
.bn-conf{position:absolute;inset:0;pointer-events:none}
.bn-conf i{position:absolute;width:10px;height:5px;border-radius:2px;animation:confloat 6s ease-in-out infinite}
.bn-l{position:relative;z-index:2;display:flex;flex-direction:column;gap:16px}
.bn-t{font-size:clamp(26px,2.9vw,40px);line-height:1.15}
.bn-t .ink{display:block;margin-bottom:6px;font-size:1.35em;line-height:1.05;color:var(--ink)}
.bn-s{font-size:18px;font-weight:700;line-height:1.4;color:rgba(255,255,255,.92)}
.gtags{display:flex;flex-wrap:wrap;gap:10px}
.gtag{position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:0;border-top:1px solid rgba(255,255,255,.55);border-bottom:1px solid rgba(255,255,255,.25);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22) 18%,rgba(255,255,255,.22) 82%,rgba(255,255,255,0));color:#fff;font-size:14px;font-weight:700;text-align:left;cursor:pointer;transition:transform .35s var(--out),background-color .25s ease}
.gtag:hover{transform:translateY(-3px)}
.gdot{width:11px;height:11px;flex:0 0 auto;border:2px solid #fff;border-radius:50%;background:var(--pink)}
.bn-ph{position:relative;z-index:2;padding:10px;border-radius:18px;background:#fff;box-shadow:0 30px 60px -20px rgba(80,0,40,.55);transform:rotate(3deg);transition:transform .5s var(--out)}
.bn-ph:hover{transform:rotate(0) scale(1.02)}
.bn-ph .slot{aspect-ratio:16/10;border-radius:12px}


/* Carousel thẻ dự án */
.cats{position:relative;z-index:2;display:flex;flex-direction:column;gap:44px}
.cat{scroll-margin-top:30px}
.cat-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.cat-h h3{font-size:clamp(26px,2.6vw,34px);line-height:1.1}
.cat-nav{display:flex;gap:8px;margin-left:auto}
.cat-nav .nb{width:44px;padding:0;justify-content:center}
.cat.fits .cat-nav{display:none}
.cr{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px) / 3);gap:18px;margin:0 -6px;padding:10px 6px 26px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding:0 6px;scrollbar-width:none}
.cr::-webkit-scrollbar{display:none}
.cr:focus-visible{outline:2.5px solid var(--pink-btn);outline-offset:2px;border-radius:12px}
/* 5 tầng của thẻ là 5 hàng subgrid → các thẻ trong carousel thẳng hàng từng tầng */
.cr{grid-template-rows:repeat(5,auto)}
.goal{display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:0;min-width:0;padding:22px;border-radius:24px;background:#fff;box-shadow:var(--sh-m);scroll-snap-align:start}
.goal.flash{animation:flash 1.1s ease 2}
.goal-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.gkind{padding:2px 10px;border-radius:999px;background:#F5F0F3;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.goal-t{margin-bottom:16px;font-size:24px;line-height:1.18}
.gft{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--pink-50)}
.gft.now{border-radius:16px 16px 0 0}
.gft.to{border-top:1.5px dashed #F7C6DA;border-radius:0 0 16px 16px}
.gft p{font-size:15px;line-height:1.45;color:var(--ink-2)}
.gft.to p{font-weight:700;color:var(--ink)}
.pnum{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--pink-btn);color:#fff;font-size:18px;line-height:1}
.puse{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;margin-top:14px}
.puse .lbl{width:100%;margin-bottom:2px}
.uchip{padding:3px 10px;border-radius:999px;background:#F5F0F3;font-size:12.5px;font-weight:700;line-height:1.5;color:var(--ink-2)}

/* ================= Lộ trình (timeline kiểu M16) ================= */
.sec-tl{background:linear-gradient(180deg,#fff 0%,#FDE4EE 22%,#FFF3F8 70%,#fff 100%)}
.tl{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:40px}
.tl-line{position:absolute;left:calc((100% - 16px) / 6);right:calc((100% - 16px) / 6);top:57.5px;height:3px;border-radius:2px;background:#F7C6DA}
.tl-i{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;text-align:center}
.yr{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 18px;border:0;border-radius:8px;background:#fff;color:var(--ink);font-size:16px;font-weight:700;white-space:nowrap;box-shadow:var(--sh-s);cursor:pointer;transition:background-color .3s ease,color .3s ease,transform .3s var(--out)}
.yr:hover{transform:translateY(-2px)}
.yr[aria-selected=true]{background:var(--ms-bg);color:#fff}
.tl-dot{position:relative;z-index:1;width:14px;height:14px;border:3px solid #F7C6DA;border-radius:50%;background:#fff;transition:background-color .3s ease,border-color .3s ease}
.tl-t{font-size:15px;font-weight:700;line-height:1.3;color:var(--ink);transition:color .3s ease}
.tl-i.sel .tl-t{color:var(--pink-text)}

.card{position:relative;z-index:2;padding:44px;border-radius:28px;background:#fff;box-shadow:0 34px 70px -34px rgba(190,30,100,.45)}
.card.flash{animation:ringflash 1.2s ease 2}
.enter-r{animation:inR .55s var(--out) both}
.enter-l{animation:inL .55s var(--out) both}
.stampl{position:relative;display:inline-flex;align-items:center;padding:.12em .3em .06em;background:var(--ms-bg);color:#fff;font-size:24px;line-height:1.25;transform-origin:left center;animation:stampin .7s var(--spring) both}
/* Nhãn sọc dùng trong chữ (6 tháng, n mục tiêu) */
.ms{display:inline-block;padding:.06em .2em .02em;background:var(--ms-bg);color:#fff;line-height:1.1}
.card-t{margin-top:16px;font-size:clamp(30px,3vw,42px);line-height:1.1}
.card-d{margin-top:8px;margin-bottom:26px;font-size:18px;line-height:1.5;color:var(--ink-2)}
/* Các cặp Học → Hành của checkpoint */
.pairs{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.pr-h,.pr{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);gap:10px}
.pr-h{margin-bottom:-2px}
.pr-h .lbl:last-child{grid-column:3}
.pr-lessons{display:grid;gap:8px}
.pr-l,.pr-r{display:flex;min-width:0;padding:14px 16px;border-radius:16px;line-height:1.45}
.pr-l{gap:10px;background:#FAF6F8}
.pr-l .gdot{margin-top:5px;border-color:#FAF6F8}
.pr-d{font-size:15.5px;color:var(--ink)}
.pr-k{display:none}
.pr-a{display:grid;align-self:start;place-items:center;height:48px;color:var(--pink)}
.pr-a .ic{width:22px;height:22px}
.pr-r{align-self:start;flex-direction:column;gap:6px;border:1.5px dashed #F7C6DA;background:#fff;text-align:left;cursor:pointer;transition:transform .3s var(--out),background-color .2s ease}
.pr-r:hover{transform:translateX(4px);background:var(--pink-50)}
.pr-r b{font-size:13.5px;font-weight:800;color:var(--pink-text)}
.card-d a{color:var(--pink-text);text-underline-offset:3px}
.col{display:flex;flex-direction:column;gap:12px}
.col ul{display:flex;flex-direction:column;gap:10px}
.col li{position:relative;padding-left:20px;font-size:16px;line-height:1.5;color:var(--ink-2)}
.col li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:2px;background:var(--pink);transform:rotate(45deg)}
.col-p li::before{background:transparent;border:2px solid var(--pink)}
.side{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.app-items{display:grid;gap:6px;width:100%}
.app-item{display:list-item;list-style:disc;margin-left:1em}
.app-item:only-child{display:block;margin-left:0}

.card-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:32px;padding-top:22px;border-top:1.5px dashed #F7C6DA}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:#F7C6DA;cursor:pointer;transition:width .4s var(--out),background-color .3s ease}
.dot.on{width:26px;background:var(--pink)}

/* ================= Giữ nhịp ================= */
.sec-sky{overflow:hidden;background:linear-gradient(180deg,#fff 0%,#E3F1FD 30%,#BFDFF9 100%)}
.sec-sky .cloud{opacity:.8}
.trk{position:relative;z-index:2;max-width:760px}
.trk-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.h2s{font-size:clamp(28px,3vw,38px);line-height:1.15}
.steps{display:flex;flex-direction:column;gap:12px}

@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(249,83,150,0)}50%{box-shadow:0 0 0 6px rgba(249,83,150,.75)}}

@keyframes popc{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}

  function closeAll() { while (stack.length) closeOv(stack[stack.length - 1].ov, true); }
  function topOv() { return stack.length ? stack[stack.length - 1].ov : null; }

  /* ================= HÀNH ĐỘNG ================= */
  function goTo(n) {
    closeAll();
    select(n);
    $("#card").classList.add("in");
    $("#lo-trinh").scrollIntoView({ behavior: behavior(), block: "start" });
    setTimeout(function () { restart($("#card"), "flash"); }, reduce ? 0 : 500);
  }
  // Nav: menu thả xuống trên màn hẹp + làm nổi mục đang xem
  function setNav(open) {
    var nav = $("#nav"), b = $("#nav-mb");
    if (nav.classList.contains("open") === open) return;
    nav.classList.toggle("open", open);
    b.setAttribute("aria-expanded", open ? "true" : "false");
    b.setAttribute("aria-label", open ? "Đóng menu" : "Mở menu");
    b.innerHTML = svg(open ? "x" : "menu");
  }
  var navLinks = [];
  function frameNav() {
    var hit = null, line = window.innerHeight * .35;
    navLinks.forEach(function (l) { if (l.sec.getBoundingClientRect().top <= line) hit = l; });
    navLinks.forEach(function (l) {
      if (l === hit) l.a.setAttribute("aria-current", "true"); else l.a.removeAttribute("aria-current");
    });
  }
  // Tới thẻ dự án (#proj-…) hoặc thẻ một phần của Product Engineer (#pl-…) rồi nháy viền
  function goEl(el) {
    if (!el) return;
    closeAll();
    var rv = el.closest(".rv"); if (rv) rv.classList.add("in");
    // inline "nearest": cuộn ngang carousel vừa đủ để thẻ hiện ra
    el.scrollIntoView({ behavior: behavior(), block: "center", inline: "nearest" });
    setTimeout(function () { restart(el, "flash"); }, reduce ? 0 : 500);
  }
  // Carousel thẻ dự án: nút ‹ › cuộn đúng 1 thẻ; ẩn nút khi đủ chỗ hiện hết thẻ
  function crStep(cr) {
    var c = $(".goal", cr);
    return c ? c.getBoundingClientRect().width + (parseFloat(getComputedStyle(cr).columnGap) || 18) : cr.clientWidth;
  }
  function crSync(cr) {
    var cat = cr.closest(".cat"), max = cr.scrollWidth - cr.clientWidth, b = $$("[data-cr]", cat);
    cat.classList.toggle("fits", max <= 2);
    b[0].disabled = cr.scrollLeft <= 2;
    b[1].disabled = cr.scrollLeft >= max - 2;
  }
  function locate(base) {
    closeAll();
    var el = $$('.slot[data-img="' + base + '"]').filter(function (e) { return !e.closest(".ov"); })[0];
    if (!el) return;
    var rv = el.closest(".rv"); if (rv) rv.classList.add("in");
    el.scrollIntoView({ behavior: behavior(), block: "center" });
    setTimeout(function () { restart(el, "flash"); }, reduce ? 0 : 450);
  }

  /* ================= NÚT "CHỖ CHÈN ẢNH" ================= */
  function updateImgBtn() {
    var btn = $("#imgbtn");
    if (!CONFIG.showImageHelper) { btn.hidden = true; return; }
    Promise.all(SLOTS.map(function (s) { return resolveImg(s.base); })).then(function (urls) {
      var filled = urls.filter(Boolean).length;
      btn.innerHTML = svg("image") + "<span>Chỗ chèn ảnh · " + filled + "/" + SLOTS.length + "</span>";
      btn.setAttribute("aria-label", "Chỗ chèn ảnh, đã có " + filled + " trên " + SLOTS.length);
      btn.hidden = filled === SLOTS.length;
    });
  }
  function openImgList() {
    Promise.all(SLOTS.map(function (s) { return resolveImg(s.base); })).then(function (urls) {
      var filled = urls.filter(Boolean).length;
      $("#dlg-img").innerHTML = '<button type="button" class="dlg-x" data-close aria-label="Đóng">' + svg("x") + "</button>" +
        '<div class="il-h"><span class="lbl lbl-p">Chỗ chèn ảnh</span><h3 id="img-t" class="dsp">' + filled + "/" + SLOTS.length + " ảnh đã có</h3>" +
        "<p>Lưu ảnh vào thư mục <code>images/</code> nằm cạnh file này, đặt đúng tên bên dưới (đuôi .jpg, .png hoặc .webp đều được), rồi tải lại trang. Ô nào chưa có ảnh vẫn hiện hình minh hoạ mặc định.</p></div>" +
        '<ul class="il">' + SLOTS.map(function (s, i) {
          return '<li class="' + (urls[i] ? "ok" : "") + '"><span class="il-s">' + svg(urls[i] ? "check" : "image") + '</span><span class="il-t"><b>' + esc(s.label) + "</b><span>" + esc(s.where) + "</span><code>" + CONFIG.imageDir + s.base + ".jpg</code></span>" +
            '<span class="il-r">' + s.ratio + '</span><button type="button" class="nb nb-sm" data-locate="' + s.base + '">Xem chỗ này</button></li>';
        }).join("") + "</ul>";
      openOv($("#ov-img"), $("#imgbtn"));
    });
  }

  /* ================= SỰ KIỆN ================= */
  document.addEventListener("click", function (e) {
    var t = e.target, el;
    if ((el = t.closest("[data-close]"))) { closeOv(el.closest(".ov")); return; }
    if (t.closest("#nav-mb")) { setNav(!$("#nav").classList.contains("open")); return; }
    if (t.closest(".nav-links a")) setNav(false);
    else if (!t.closest("#nav")) setNav(false);
    if ((el = t.closest("[data-goto]"))) { goTo(+el.getAttribute("data-goto")); return; }
    if ((el = t.closest("[data-goto-sec]"))) { closeAll(); $("#" + el.getAttribute("data-goto-sec")).scrollIntoView({ behavior: behavior() }); return; }
    if ((el = t.closest("[data-tab]"))) { select(+el.getAttribute("data-tab")); return; }
    if ((el = t.closest("[data-pnav]"))) { select(sel + +el.getAttribute("data-pnav")); return; }
    if ((el = t.closest("[data-proj]"))) { goEl($("#proj-" + el.getAttribute("data-proj"))); return; }
    if ((el = t.closest("[data-cr]"))) { var cr = $(".cr", el.closest(".cat")); cr.scrollBy({ left: +el.getAttribute("data-cr") * crStep(cr), behavior: behavior() }); return; }
    if ((el = t.closest("[data-locate]"))) { locate(el.getAttribute("data-locate")); return; }
    if (t.closest("#imgbtn")) { openImgList(); return; }
    if (t.classList && t.classList.contains("ov")) { closeOv(t); return; }
  });

  document.addEventListener("keydown", function (e) {
    var top = topOv();
    if (e.key === "Escape") { if (top) closeOv(top); else if ($("#nav").classList.contains("open")) { setNav(false); $("#nav-mb").focus(); } return; }
    if (top && e.key === "Tab") {
      var f = $$('button:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])', top).filter(function (x) { return x.offsetParent !== null; });
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); }
      return;
    }
    if (!top && e.target.matches && e.target.matches("[role=tab]") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      var nn = sel + (e.key === "ArrowRight" ? 1 : -1);
      if (nn >= 1 && nn <= PILLARS.length) { select(nn); $("#tab-" + nn).focus(); }
      e.preventDefault();
    }
  });

  /* ================= CHUYỂN ĐỘNG THEO CUỘN ================= */
  var sbar = $("#sbar"), ticking = false;

  function frame() {
    ticking = false;
    var y = window.scrollY, vh = window.innerHeight, H = document.documentElement.scrollHeight;
    sbar.style.transform = "scaleX(" + clamp(y / Math.max(1, H - vh), 0, 1) + ")";
    frameNav();
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }

  function bindMotion() {
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", function () { onScroll(); $$(".cr").forEach(crSync); });
    $$(".cr").forEach(function (cr) { cr.addEventListener("scroll", function () { crSync(cr); }, { passive: true }); crSync(cr); });
    document.documentElement.classList.add("js");
    if (!("IntersectionObserver" in window)) { $$(".rv,.rv-t").forEach(function (el) { el.classList.add("in"); }); return; }
    var rv = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); rv.unobserve(en.target); } });
    }, { rootMargin: "0px 0px -10% 0px" });
    $$(".rv,.rv-t").forEach(function (el) { rv.observe(el); });
  }

  /* ================= KHỞI ĐỘNG ================= */
  if (!CONFIG.showImageHelper) document.documentElement.classList.add("no-helper");
  renderStatic();
  $("#nav-mb").innerHTML = svg("menu");
  navLinks = $$(".nav-links a").map(function (a) { return { a: a, sec: $(a.getAttribute("href")) }; });
  renderCard("");
  hydrateSlots(document);
  bindMotion();
  frame();
  updateImgBtn();
})();
</script>
</body>
</html>
